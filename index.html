<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://www.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://us-east1-forge-web-f2351.cloudfunctions.net; img-src 'self' data: blob: https://www.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- Dark first; the light theme follows the system setting (css/tokens.css). -->
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <style>html,body{background:#0a0a0b;color:#f5f5f7;margin:0;color-scheme:dark light}@media(prefers-color-scheme:light){html,body{background:#f2f2f7;color:#0d0d10}}</style>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forge">
  <meta name="description" content="Personal fitness and nutrition tracker">
  <title>Forge</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/health.css">
  <link rel="stylesheet" href="css/photos.css">
  <link rel="stylesheet" href="css/missions.css">
  <link rel="stylesheet" href="css/report.css">
  <link rel="stylesheet" href="css/food.css">
  <link rel="stylesheet" href="css/quicklog.css">
  <link rel="stylesheet" href="css/lock.css">
  <link rel="stylesheet" href="css/mfa.css">
  <script src="js/lock-boot.js"></script>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js">
</head>
<body>
  <dialog id="lock" aria-label="Forge is locked" aria-hidden="true">
    <img class="lk-mark" src="icons/icon-192.png" alt="" width="88" height="88">
    <h1 class="lk-ui">Forge is locked</h1>
    <p class="lk-sub lk-ui">Your training and photos are private. Unlock with Face ID or your passcode.</p>
    <button type="button" class="lk-btn lk-ui" data-unlock>Unlock</button>
    <p class="lk-err lk-ui" data-lock-error role="status"></p>
  </dialog>
  <button id="update" class="update-capsule" hidden><span>Update available</span><b>Reload</b></button>
  <header id="navbar" class="navbar" hidden>
    <button class="nb-back" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Back</span>
    </button>
    <p class="nb-title" aria-hidden="true"></p>
    <span id="sync" class="nb-status" role="status" hidden></span>
  </header>
  <div id="offline" class="offline-banner" role="status" hidden>You’re offline. Changes are saved on this phone.</div>
  <main id="main" tabindex="-1">
    <div class="skel-screen" aria-label="Loading">
      <div class="skeleton sk-title"></div>
      <div class="skeleton sk-card"></div>
      <div class="skeleton sk-card short"></div>
      <div class="skeleton sk-card"></div>
    </div>
  </main>
  <nav id="nav" class="tabbar" hidden aria-label="Main">
    <a href="#/today"><svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.2"/></svg><svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.4" opacity=".45"/><path fill-rule="evenodd" d="M12 2.6a9.4 9.4 0 100 18.8 9.4 9.4 0 000-18.8zm0 2a7.4 7.4 0 110 14.8 7.4 7.4 0 010-14.8z"/><circle cx="12" cy="12" r="5.1"/></svg><span>Today</span></a>

    <a href="#/food"><svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 3v5.2a2.5 2.5 0 005 0V3M7 3v6.5M7 11.5v9.5M17.5 21V3c-2.4 1.6-3.5 4.4-3.5 7.5 0 1.7.9 2.5 2 2.5h1.5"/></svg><svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 3.2a.9.9 0 011.8 0v5a1.6 1.6 0 003.2 0v-5a.9.9 0 011.8 0v5a3.4 3.4 0 01-2.5 3.28V20.4a.9.9 0 01-1.8 0v-9.92A3.4 3.4 0 013.6 8.2z"/><path opacity=".45" d="M18.4 2.7v10.6h-2.3c-1.3 0-2.1-.9-2.1-2.6 0-2.9 1-5.6 3.3-7.2a.9.9 0 011.1.1z"/><rect x="16.6" y="12.4" width="1.8" height="9" rx=".9"/></svg><span>Food</span></a>

  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
