# Runs on every push to main and every pull request: unit tests (math, generator, progression, CSV),
# the Cloud Functions tests (functions/, no network) and the Firestore security-rule tests against the local emulator (demo project, never your real one).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # queue-dispatched Claude PRs are opened with GITHUB_TOKEN, so claude.yml starts this directly

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.js

  functions:
    name: Functions tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and run (no network calls in tests; fake Firestore and Withings)
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          npm test
          test -f .smoke-ran && echo "::notice title=Functions wiring::$(cat .smoke-ran) functions load with region us-east1 and maxInstances 2"

  rules:
    name: Security rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and run
        working-directory: tests/rules
        run: |
          npm install --no-audit --no-fund
          npm test

  screens:
    name: Screens (headless renders)
    runs-on: ubuntu-latest
    # The full render matrix takes ~25 min. It only produces the 'screens' artifact for review;
    # pass/fail comes from the Unit, Functions and Rules jobs, so a slow render never blocks a PR.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render every screen (390x844, Duo folded and unfolded, dark and light)
        run: |
          timeout 45m npm run screens || echo "::warning title=Screens::render run stopped early or a layout check failed; the artifact holds whatever was saved"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens/
          if-no-files-found: warn
          retention-days: 14
