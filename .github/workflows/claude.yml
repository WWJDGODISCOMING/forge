name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  # Started by queue-next.yml (comments made with GITHUB_TOKEN can't trigger the @claude path above)
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to implement
        required: true
        type: string
      version:
        description: Version reserved in QUEUE.md (e.g. 0.16.41)
        required: true
        type: string
      prompt:
        description: Optional extra instructions
        required: false
        type: string

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 120  # big fit-and-finish parts ran past 60 min (Oct 10)
    outputs:
      saved_branch: ${{ steps.leftover_pr.outputs.branch }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare the queued item (workflow_dispatch only)
        id: prep
        if: github.event_name == 'workflow_dispatch'
        env:
          EXTRA: ${{ inputs.prompt }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[0-9]+$ ]] && [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad inputs"; exit 1; }
          # Oct 20: Claude was denied reading /tmp (outside the repo), so hand-off files live in .queue/, which git ignores locally.
          mkdir -p .queue && echo '/.queue/' >> .git/info/exclude
          gh issue view "$ISSUE" --json number,title,body,comments \
            --jq '"# #\(.number) \(.title)\n\n\(.body)\n\n## Comments\n" + ([.comments[] | "### \(.author.login)\n\(.body)"] | join("\n\n"))' > .queue/issue.md
          git checkout -b "claude/queue-v$VERSION"
          {
            echo 'prompt<<QUEUE_PROMPT_EOF'
            echo "Please implement issue #$ISSUE per QUEUE.md and CLAUDE.md, including the Self-review checklist. Version $VERSION."
            echo "The issue and its comments are in .queue/issue.md (read it with the Read tool)."
            echo "You are on branch claude/queue-v$VERSION. Commit and push only to that branch (never to main), early and often: after every commit run git push -u origin claude/queue-v$VERSION."
            echo "Push your first commit within your first few turns, and before you finish make sure git status is clean and everything is pushed. Unpushed work is lost when the run ends."
            echo "CI renders the full screens matrix; locally render only the changed routes (LAYOUT_ROUTES=...). If a command is denied, switch to an allowed one instead of retrying. Use Write/Edit to create files (not cat heredocs), prefix env vars with env (env LAYOUT_SHOTS=screens node ...), avoid ( ) subshells, and commit + push your work before starting long renders."
            echo "Include the QUEUE.md status change for this item (in-review) in your commits."
            echo "When done, write your summary and the ticked Self-review checklist to .queue/pr-body.md (git ignores .queue/; never commit it); the workflow opens the PR with it. Do not guess the PR number in QUEUE.md; write 'in-review' and the reviewer fills the number in."
            echo "$EXTRA"
            echo 'QUEUE_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # The full test suite (incl. the headless layout test) takes ~2-3 min.
          # With the default 2-min Bash timeout it got moved to the background,
          # and three runs on #69 then ended without a final result or a push.
          BASH_DEFAULT_TIMEOUT_MS: "600000"
          BASH_MAX_TIMEOUT_MS: "900000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # queue-next.yml dispatches this run with GITHUB_TOKEN, so the actor is github-actions[bot]. Allow only that bot,
          # and only for workflow_dispatch (which needs repo write access); comment/review events stay human-only.
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && 'github-actions' || '' }}
          # Empty for comment/review events (tag mode, unchanged). Set only for workflow_dispatch (automation mode).
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --max-turns 300
            --allowedTools "Edit,Write,MultiEdit,Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(sed:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(test:*),Bash(diff:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(awk:*),Bash(cut:*),Bash(tr:*),Bash(echo:*),Bash(pwd:*),Bash(jq:*),Bash(python3:*),Bash(cd:*),Bash(env:*),Bash(which:*),Bash(printf:*)"

      # Oct 20: the first queued run (#158) worked 86 min and ended without pushing, so nothing could be reviewed.
      # Safety net: push whatever Claude left on the runner, and print why it stopped (final message + denied commands).
      - name: Report how Claude finished
        if: always() && steps.claude.outcome != 'skipped'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          f="${EXEC_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          [ -f "$f" ] || { echo "No execution file."; exit 0; }
          echo "::group::Denied commands"
          jq -r '(if type=="array" then .[] else . end) | select(.type=="result") | .permission_denials[]? | "\(.tool_name): \((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:160])"' "$f" || true
          echo "::endgroup::"
          echo "::group::Claude's final message"
          jq -r '(if type=="array" then .[] else . end) | select(.type=="result") | (.result // "") | tostring | .[0:3000]' "$f" || true
          echo "::endgroup::"

      - name: Push leftover work (workflow_dispatch only)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="claude/queue-v$VERSION"
          git checkout "$branch" 2>/dev/null || true
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -q -m "v$VERSION: work in progress saved by the workflow (Claude's run ended with uncommitted changes)" || true
          fi
          ahead=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          echo "Commits on $branch not on main: $ahead"
          [ "$ahead" -gt 0 ] || { echo "Nothing to push."; exit 0; }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push -u origin "HEAD:refs/heads/$branch" || echo "::warning::Push failed (workflow files can't be pushed with GITHUB_TOKEN)."
          if [ ! -s .queue/pr-body.md ]; then
            printf 'Claude did not write a PR body or finish its Self-review checklist; this branch holds what it left on the runner (pushed by the workflow). Needs another @claude round before review.\n' > .queue/pr-body.md
          fi

      # Oct 20: an @claude fix-up round on PR #162 ran 80 min. Claude's GitHub App token expires after 1 hour,
      # so its later pushes (and its progress comment) failed with 401 and the whole round was lost.
      # Same safety net for comment/review runs: push what Claude left on its claude/* branch with GITHUB_TOKEN
      # (valid for the whole job). Never pushes main or non-claude branches.
      - name: Push leftover work (comment/review runs)
        id: leftover_pr
        if: always() && github.event_name != 'workflow_dispatch' && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
          case "$branch" in claude/*) ;; *) echo "On '$branch', not a claude/* branch; nothing to save."; exit 0;; esac
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- . ':!.claude-pr' ':!.queue')" ]; then
            # Plain add (ignored files are skipped), then unstage hand-off files. Naming an ignored path in a pathspec makes git add exit 1.
            git add -A || true
            git reset -q -- .claude-pr .queue 2>/dev/null || true
            git commit -q -m "Work in progress saved by the workflow (Claude's run ended with uncommitted changes)" || true
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q origin "$branch" 2>/dev/null && base="origin/$branch" || base="origin/main"
          ahead=$(git rev-list --count "$base..HEAD" 2>/dev/null || echo 0)
          echo "Commits on $branch not on $base: $ahead"
          [ "$ahead" -gt 0 ] || { echo "Nothing to push."; exit 0; }
          if git push origin "HEAD:refs/heads/$branch"; then
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude's unpushed work on $branch was pushed by the workflow."
          else
            echo "::error::Push of leftover work to $branch failed (workflow files can't be pushed with GITHUB_TOKEN)."
          fi

      - name: Keep Claude's PR body (workflow_dispatch only)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pr-body
          path: .queue/pr-body.md
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      # Oct 20: the repo doesn't let GITHUB_TOKEN create PRs ("GitHub Actions is not permitted to create or approve
      # pull requests"). If it's refused, post the body on the issue and fail on purpose: the red run wakes the
      # review checkpoint, which opens the PR from the branch with that body.
      - name: Open the PR (workflow_dispatch only)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="claude/queue-v$VERSION"
          if ! gh api "repos/$REPO/branches/$branch" --silent 2>/dev/null; then echo "No branch $branch was pushed."; exit 0; fi
          if [ -n "$(gh pr list -R "$REPO" --head "$branch" --state all --json number --jq '.[0].number')" ]; then echo "PR already exists."; exit 0; fi
          [ -s .queue/pr-body.md ] || echo "Claude did not write a PR body; see the run log." > .queue/pr-body.md
          printf '\n\nCloses #%s (queued from QUEUE.md). Run: %s/%s/actions/runs/%s\n' "$ISSUE" "$GITHUB_SERVER_URL" "$REPO" "$GITHUB_RUN_ID" >> .queue/pr-body.md
          title=$(gh issue view "$ISSUE" -R "$REPO" --json title --jq .title)
          if gh pr create -R "$REPO" --base main --head "$branch" --title "v$VERSION: $title" --body-file .queue/pr-body.md; then exit 0; fi
          { printf 'Queued run finished and pushed `%s`, but GitHub refused to let the workflow open the PR. The review checkpoint will open it with the body below (also saved as the `pr-body` artifact of this run).\n\n<details><summary>Claude'"'"'s PR body</summary>\n\n' "$branch"; cat .queue/pr-body.md; printf '\n</details>\n'; } > .queue/handoff.md
          gh issue comment "$ISSUE" -R "$REPO" --body-file .queue/handoff.md || true
          echo "::error::PR for $branch must be opened by the review checkpoint (body is on issue #$ISSUE and in the pr-body artifact)."
          exit 1

  # A PR opened (or a push made) with GITHUB_TOKEN doesn't fire pull_request workflows, so start the tests on the branch directly.
  tests-on-branch:
    needs: claude
    if: always() && needs.claude.result != 'skipped' && (github.event_name == 'workflow_dispatch' || needs.claude.outputs.saved_branch != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch tests.yml on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SAVED: ${{ needs.claude.outputs.saved_branch }}
        run: |
          branch="${SAVED:-claude/queue-v$VERSION}"
          if gh api "repos/$REPO/branches/$branch" --silent 2>/dev/null; then gh workflow run tests.yml -R "$REPO" --ref "$branch"; else echo "No branch $branch."; fi
